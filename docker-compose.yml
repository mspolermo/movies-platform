services:
  api-gateway:
    build:
      context: .
      dockerfile: ./apps/api-gateway/Dockerfile
      target: development
    command: >
      sh -c "npm run start:dev api-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
      auth-users:
        condition: service_healthy
      kino-db:
        condition: service_healthy
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - '${BIND_HOST:-127.0.0.1}:${GATEWAY_PUBLISH_PORT:-5001}:${GATEWAY_LISTEN_PORT:-5000}'
    env_file:
      - .env
    environment:
      - PORT=${GATEWAY_LISTEN_PORT:-5000}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASS=${RABBITMQ_PASS}
      - RABBITMQ_URL=amqp://rabbitmq:${RABBITMQ_AMQP_LISTEN_PORT:-5672}
      - USERS_QUEUE=${USERS_QUEUE:-users_queue}
      - FILMS_QUEUE=${FILMS_QUEUE:-films_queue}
      - PRIVATE_KEY=${PRIVATE_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:$$PORT/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
  auth-users:
    build:
      context: .
      dockerfile: ./apps/auth-users/Dockerfile
      target: development
    command: >
      sh -c "sleep 15 && npm run start:dev auth-users"
    depends_on:
      db2:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - '${BIND_HOST:-127.0.0.1}:${AUTH_USERS_PUBLISH_PORT:-3001}:${AUTH_USERS_LISTEN_PORT:-3001}'
    env_file:
      - .env
    environment:
      - PORT=${AUTH_USERS_LISTEN_PORT:-3001}
      - POSTGRES_HOST=db2
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASS=${RABBITMQ_PASS}
      - RABBITMQ_URL=amqp://rabbitmq:${RABBITMQ_AMQP_LISTEN_PORT:-5672}
      - USERS_QUEUE=${USERS_QUEUE:-users_queue}
      - PRIVATE_KEY=${PRIVATE_KEY}
      - JWT_ACCESS_EXPIRES_IN=${JWT_ACCESS_EXPIRES_IN}
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:$$PORT/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
  kino-db:
    build:
      context: .
      dockerfile: ./apps/kino-db/Dockerfile
      target: development
    command: >
      sh -c "sleep 15 && npm run start:dev kino-db"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - '${BIND_HOST:-127.0.0.1}:${KINO_DB_PUBLISH_PORT:-3002}:${KINO_DB_LISTEN_PORT:-3002}'
    env_file:
      - .env
    environment:
      - PORT=${KINO_DB_LISTEN_PORT:-3002}
      - POSTGRES_HOST=db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB_KINO}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASS=${RABBITMQ_PASS}
      - RABBITMQ_URL=amqp://rabbitmq:${RABBITMQ_AMQP_LISTEN_PORT:-5672}
      - FILMS_QUEUE=${FILMS_QUEUE:-films_queue}
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:$$PORT/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
  kino-db-seed:
    image: postgres:15
    command: >
      sh /seed/run-dev-seed.sh
    depends_on:
      db:
        condition: service_healthy
      kino-db:
        condition: service_started
    volumes:
      - ./devops/kino-db/seed:/seed:ro
    # без env_file: не тащить host RABBITMQ_URL / лишние secrets в one-shot
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB_KINO}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
    networks:
      - default
    restart: "no"
  pgadmin:
    image: dpage/pgadmin4
    profiles:
      - tools
    ports:
      - '${BIND_HOST:-127.0.0.1}:${PGADMIN_PUBLISH_PORT:-5050}:${PGADMIN_LISTEN_PORT:-80}'
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    depends_on:
      db:
        condition: service_healthy
      db2:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:3.10.7-management
    ports:
      - '${BIND_HOST:-127.0.0.1}:${RABBITMQ_AMQP_PUBLISH_PORT:-5672}:${RABBITMQ_AMQP_LISTEN_PORT:-5672}'
      - '${BIND_HOST:-127.0.0.1}:${RABBITMQ_MGMT_PUBLISH_PORT:-15672}:${RABBITMQ_MGMT_LISTEN_PORT:-15672}'
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    volumes:
      - rmq_data:/var/lib/rabbitmq
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
  db:
    container_name: db
    image: postgres:15
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB_KINO}
    ports:
      - '${BIND_HOST:-127.0.0.1}:${POSTGRES_KINO_PUBLISH_PORT:-5432}:${POSTGRES_LISTEN_PORT:-5432}'
    volumes:
      - pg_kino:/var/lib/postgresql/data
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_KINO}"]
      interval: 30s
      timeout: 10s
      retries: 3
  db2:
    container_name: db2
    image: postgres:15
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB_USER}
    ports:
      - '${BIND_HOST:-127.0.0.1}:${POSTGRES_USERS_PUBLISH_PORT:-5433}:${POSTGRES_LISTEN_PORT:-5432}'
    volumes:
      - pg_users:/var/lib/postgresql/data
      - ./devops/users-db/users-init-dump.sql:/docker-entrypoint-initdb.d/users-init-dump.sql
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_USER}"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  default:
    driver: bridge

volumes:
  pg_kino:
  pg_users:
  rmq_data:
